<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deadshot Clone - Client</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: monospace; }
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; text-align: center; font-size: 20px; background: rgba(0, 0, 0, 0.8);
            padding: 20px; border-radius: 8px; cursor: pointer; border: 2px solid #444;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #00ff00; font-size: 24px; pointer-events: none; display: none;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <h2>Click to Play</h2>
        <p><b>WASD</b> to move | <b>MOUSE</b> to look | <b>ESC</b> to release</p>
    </div>
    <div id="crosshair">+</div>

    <!-- Three.js and PointerLockControls CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <!-- Pure JavaScript Game Logic -->
    <script src="game.js"></script>
</body>
</html>
